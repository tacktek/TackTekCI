name: iOS CI - PR Staging

on:
  repository_dispatch:
    types: [pr-staging]

jobs:
  ios-ci:
    runs-on: macos-26

    steps:
      - name: Show dispatch payload
        run: |
          echo "Source repo: ${{ github.event.client_payload.source_repo }}"
          echo "Ref: ${{ github.event.client_payload.ref }}"
          echo "SHA: ${{ github.event.client_payload.sha }}"

      - name: Checkout iOS repo
        uses: actions/checkout@v4
        with:
          repository: tacktek/TackTek
          ref: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install dependencies
        run: bundle install

      - name: Preboot simulator (no timeout)
        shell: bash
        run: |
          set -euo pipefail

          UDID="75A02ADD-C903-4C9E-B4B6-F2A548242E6A"

          # Shut down if possible (ignore "already shutdown")
          xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true

          # Start boot (this may hang; you can cancel the job manually if it does)
          xcrun simctl boot "$UDID" >/dev/null 2>&1 || true

          # Block until boot completes
          xcrun simctl bootstatus "$UDID" -b

          echo "Simulator booted OK"

      - name: Run CI Fastlane
        run: bundle exec fastlane ci

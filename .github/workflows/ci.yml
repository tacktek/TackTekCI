name: iOS CI - PR Staging

on:
  repository_dispatch:
    types: [pr-staging]

jobs:
  ios-ci:
    runs-on: macos-26-xlarge

    steps:
      - name: Show dispatch payload
        run: |
          echo "Source repo: ${{ github.event.client_payload.source_repo }}"
          echo "Ref: ${{ github.event.client_payload.ref }}"
          echo "SHA: ${{ github.event.client_payload.sha }}"

      - name: Checkout iOS repo
        uses: actions/checkout@v4
        with:
          repository: tacktek/TackTek
          ref: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install dependencies
        run: bundle install

      - name: Preboot simulator with timeout (no erase)
        shell: bash
        run: |
          set -euo pipefail
          UDID="75A02ADD-C903-4C9E-B4B6-F2A548242E6A"

          xcrun simctl shutdown "$UDID" || true
          xcrun simctl boot "$UDID" || true

          # Wait up to 120s for a real boot
          if ! xcrun simctl bootstatus "$UDID" -b -t 120; then
            echo "Simulator boot timed out; restarting CoreSimulatorService and retrying once..."
            killall Simulator || true
            killall -9 com.apple.CoreSimulator.CoreSimulatorService || true

            xcrun simctl shutdown "$UDID" || true
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b -t 120
          fi

      - name: Run CI Fastlane
        run: bundle exec fastlane ci

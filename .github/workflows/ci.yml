name: iOS CI - PR Staging

on:
  repository_dispatch:
    types: [pr-staging]

jobs:
  ios-ci:
    runs-on: macos-26

    steps:
      - name: Show dispatch payload
        run: |
          echo "Source repo: ${{ github.event.client_payload.source_repo }}"
          echo "Ref: ${{ github.event.client_payload.ref }}"
          echo "SHA: ${{ github.event.client_payload.sha }}"

      - name: Checkout iOS repo
        uses: actions/checkout@v4
        with:
          repository: tacktek/TackTek
          ref: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install dependencies
        run: bundle install

      - name: Preboot simulator
        shell: bash
        run: |
          set -euo pipefail

          # Find an available iPhone simulator dynamically
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '.devices | to_entries[]
              | select(.key | contains("iOS"))
              | .value[]
              | select(.name | test("iPhone 16$"))
              | .udid' | head -1)

          if [ -z "$UDID" ]; then
            echo "❌ No matching simulator found. Available devices:"
            xcrun simctl list devices available
            exit 1
          fi

          echo "Found simulator: $UDID"

          # Shut down if possible (ignore "already shutdown")
          xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true

          # Boot and wait
          xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$UDID" -b

          echo "✅ Simulator booted OK"

          # Export for use in Fastlane
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run CI Fastlane
        run: bundle exec fastlane ci
        env:
          SIM_UDID: ${{ env.SIM_UDID }}

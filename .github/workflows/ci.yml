name: iOS CI - PR Staging

on:
  repository_dispatch:
    types: [pr-staging]

jobs:
  ios-ci:
    runs-on: macos-26-xlarge

    steps:
      - name: Show dispatch payload
        run: |
          echo "Source repo: ${{ github.event.client_payload.source_repo }}"
          echo "Ref: ${{ github.event.client_payload.ref }}"
          echo "SHA: ${{ github.event.client_payload.sha }}"

      - name: Checkout iOS repo
        uses: actions/checkout@v4
        with:
          repository: tacktek/TackTek
          ref: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install dependencies
        run: bundle install

      - name: Preboot simulator (hard timeout, Xcode 26.0.1 compatible)
        shell: bash
        run: |
          set -euo pipefail

          UDID="75A02ADD-C903-4C9E-B4B6-F2A548242E6A"

          # Shut down if possible (ignore "already shutdown")
          xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true

          # Start boot
          xcrun simctl boot "$UDID" >/dev/null 2>&1 || true

          # Wait for boot to complete, but CAP it at 120s.
          if ! timeout 120 xcrun simctl bootstatus "$UDID" -b; then
            echo "ERROR: Simulator failed to boot within 120s"

            echo "Attempting one CoreSimulator reset + retry..."
            killall Simulator >/dev/null 2>&1 || true
            killall -9 com.apple.CoreSimulator.CoreSimulatorService >/dev/null 2>&1 || true

            xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true
            xcrun simctl boot "$UDID" >/dev/null 2>&1 || true

            if ! timeout 120 xcrun simctl bootstatus "$UDID" -b; then
              echo "ERROR: Simulator still did not boot after retry"
              exit 1
            fi
          fi

          echo "Simulator booted OK"

      - name: Run CI Fastlane
        run: bundle exec fastlane ci

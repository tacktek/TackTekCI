# ci.yml
# Runs CI checks for pull requests targeting the staging branch.
# Triggered via repository_dispatch from the private TackTek repo.
# Checks out the private repo at a specific commit SHA and runs the fastlane ci lane.
#
# Dispatch event: pr-staging
# Payload: source_repo, ref, sha

name: iOS CI - PR Staging

on:
  repository_dispatch:
    types: [pr-staging]

jobs:
  ios-ci:
    runs-on: macos-26

    steps:
      - name: Show dispatch payload
        run: |
          echo "Source repo: ${{ github.event.client_payload.source_repo }}"
          echo "Ref: ${{ github.event.client_payload.ref }}"
          echo "SHA: ${{ github.event.client_payload.sha }}"

      - name: Checkout iOS repo
        uses: actions/checkout@v4
        with:
          repository: tacktek/TackTek
          ref: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install dependencies
        run: bundle install

      - name: Run CI Fastlane
        run: bundle exec fastlane ci
